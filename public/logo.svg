<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for better visual appeal -->
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waveGradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a3e635;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="white" stroke="#e5e7eb" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- House structure with improved visibility -->
  <g transform="translate(200, 80)">
    <!-- Roof -->
    <path d="M -80 40 L 0 -20 L 80 40 L 60 40 L 60 55 L -60 55 L -60 40 Z" 
          fill="url(#houseGradient)" 
          stroke="#0f172a" 
          stroke-width="2"/>
    
    <!-- Chimney -->
    <rect x="-70" y="10" width="12" height="25" fill="url(#houseGradient)" stroke="#0f172a" stroke-width="1"/>
    
    <!-- House body -->
    <rect x="-60" y="40" width="120" height="60" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="-8" y="65" width="16" height="35" fill="url(#houseGradient)" rx="8"/>
    <circle cx="5" cy="82" r="1.5" fill="#fbbf24"/>
  </g>
  
  <!-- Main title with better typography -->
  <text x="200" y="160" text-anchor="middle" 
        font-family="serif" 
        font-size="32" 
        font-weight="bold" 
        fill="#1e293b" 
        letter-spacing="2px">ALL</text>
        
  <text x="200" y="200" text-anchor="middle" 
        font-family="serif" 
        font-size="36" 
        font-weight="bold" 
        fill="#1e293b" 
        letter-spacing="1px">NURSES</text>
  
  <!-- Horizontal line -->
  <line x1="120" y1="215" x2="280" y2="215" stroke="#64748b" stroke-width="2"/>
  
  <!-- Subtitle -->
  <text x="200" y="240" text-anchor="middle" 
        font-family="sans-serif" 
        font-size="14" 
        font-weight="normal" 
        fill="#64748b" 
        letter-spacing="3px">HOME HEALTH</text>
  
  <!-- Flowing waves with improved colors and visibility -->
  <g transform="translate(0, 260)">
    <!-- Wave 1 -->
    <path d="M 50 40 Q 100 20, 150 40 T 250 40 T 350 40 L 350 60 Q 300 80, 250 60 T 150 60 T 50 60 Z" 
          fill="url(#waveGradient1)" 
          opacity="0.9"/>
    
    <!-- Wave 2 -->
    <path d="M 60 60 Q 120 40, 180 60 T 300 60 T 380 60 L 380 80 Q 320 100, 260 80 T 140 80 T 60 80 Z" 
          fill="url(#waveGradient2)" 
          opacity="0.8"/>
    
    <!-- Wave 3 -->
    <path d="M 40 80 Q 100 60, 160 80 T 280 80 T 360 80 L 360 100 Q 300 120, 240 100 T 120 100 T 40 100 Z" 
          fill="url(#waveGradient3)" 
          opacity="0.7"/>
  </g>
  
  <!-- Medical cross accent -->
  <g transform="translate(320, 120)">
    <rect x="-8" y="-2" width="16" height="4" fill="#ef4444" rx="2"/>
    <rect x="-2" y="-8" width="4" height="16" fill="#ef4444" rx="2"/>
  </g>
  
  <!-- Heart accent -->
  <g transform="translate(90, 130)">
    <path d="M 0 5 C -5 0, -15 0, -15 10 C -15 20, 0 25, 0 25 C 0 25, 15 20, 15 10 C 15 0, 5 0, 0 5 Z" 
          fill="#ec4899" opacity="0.8"/>
  </g>
</svg>